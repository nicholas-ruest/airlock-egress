[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-egress"
version = "0.1.0"
description = "Compile and simulate narrow, expiring egress contracts"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Nick Ruest"}]
keywords = ["cilium", "egress", "policy", "sandbox", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.8"]

[project.scripts]
airlock-egress = "airlock_egress.cli:main"

[tool.setuptools.packages.find]
include = ["airlock_egress*"]
